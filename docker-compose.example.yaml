# 部署配置示例模板（含真实密钥/密码的版本请自行维护，勿提交到仓库）
# 复制为 docker-compose.yaml 并按需修改环境变量
services:
  transparentllm:
    image: transparentllm:latest
    container_name: transparentllm
    expose:
      - "18400"
    environment:
      # 32 字节加密密钥，务必替换为随机值并妥善保管（用于加密存储的 API Key）
      - TRANSPARENTLLM_ENCRYPTION_KEY=change-me-to-32-byte-secret-key!!
      - TRANSPARENTLLM_HOST=0.0.0.0
      - TRANSPARENTLLM_PORT=18400
      # 数据库连接串：请使用环境变量或 .env 注入，勿硬编码明文密码
      - TRANSPARENTLLM_DATABASE_URL=postgres://ydl:${TRANSPARENTLLM_DB_PASSWORD}@your-db-host:5432/transparentllm
      - TRANSPARENTLLM_LOG_RETENTION_DAYS=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nginx-net

networks:
  nginx-net:
    external: true
